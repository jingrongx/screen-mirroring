name: Release

# 推送到 main：自动构建；若 versionName 对应的 Tag 不存在则自动发版并更新 latest.json
# 也可在 Actions 页面手动触发
on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'update/**'
      - '**.md'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: 构建并自动发版
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 恢复签名密钥（可选，未配置则用 debug 签名）
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$GITHUB_WORKSPACE/keystore.jks"
            echo "KEYSTORE_FILE=$GITHUB_WORKSPACE/keystore.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "已配置正式签名"
          else
            echo "未配置签名密钥 secrets，本次使用 debug 签名"
          fi

      - name: 编译 Release / Debug APK
        run: ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: 读取版本号
        id: ver
        run: |
          VERSION_NAME=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          VERSION_CODE=$(grep -oP 'versionCode\s*=\s*\K[0-9]+' app/build.gradle.kts | head -1)
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "版本：v$VERSION_NAME (code $VERSION_CODE)"

      - name: 检查 Tag 是否已存在
        id: tag
        run: |
          TAG="v${{ steps.ver.outputs.name }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q "refs/tags/$TAG"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 上传构建产物（每次提交都可下载）
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.ver.outputs.name }}-${{ github.run_number }}
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk

      - name: 创建 Release 并更新 latest.json
        if: steps.tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
        run: |
          set -euo pipefail
          TAG="v$VERSION_NAME"
          APK_NAME="ScreenMirror-v$VERSION_NAME.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK_NAME"
          SHA=$(sha256sum "$APK_NAME" | cut -d' ' -f1)

          # 生成更新日志（上次 Tag 之后的提交）
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log --pretty=format:'- %s (%h)' "$PREV_TAG"..HEAD | head -30)
          else
            NOTES=$(git log --pretty=format:'- %s (%h)' | head -30)
          fi

          cat > notes.md <<EOF
          ## 更新内容

          $NOTES

          ---
          versionCode: $VERSION_CODE
          sha256: \`$SHA\`
          > APK 下载慢可在应用内「检查更新」，会自动走国内加速代理。
          EOF

          gh release create "$TAG" "$APK_NAME" \
            --title "v$VERSION_NAME" \
            --notes-file notes.md

          # 更新 latest.json（应用内自动更新读取此文件）
          jq -n \
            --arg vn "$VERSION_NAME" \
            --arg vc "$VERSION_CODE" \
            --arg url "https://github.com/${{ github.repository }}/releases/download/$TAG/$APK_NAME" \
            --arg sha "$SHA" \
            --arg log "$NOTES" \
            '{versionCode: ($vc|tonumber), versionName: $vn, minVersionCode: 0, url: $url, sha256: $sha, changelog: $log}' \
            > update/latest.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update/latest.json
          if git diff --cached --quiet; then
            echo "latest.json 无变化"
          else
            git commit -m "chore(release): v$VERSION_NAME 自动更新 latest.json [skip ci]"
            git push
          fi
